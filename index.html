<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class = "container">
        <div class = "pantalla">
            <input type="text" id = "pantalla">
        </div>
        <div class = "botones">
            <div class = "columna">
                <button onclick = "limpiar()" class = "btn-rojo">C</button>
                <button onclick = "agregarNumero('7')" class = "btn">7</button>
                <button onclick = "agregarNumero('4')" class = "btn">4</button>
                <button onclick = "agregarNumero('1')" class = "btn">1</button>
                <button onclick = "agregarNumero('.')" class = "btn">.</button>
            </div>
            <div class = "columna">
                <button onclick = "borrarUltimo()" class = "btn-rojo">AC</button>
                <button onclick = "agregarNumero('8')" class = "btn">8</button>
                <button onclick = "agregarNumero('5')" class = "btn">5</button>
                <button onclick = "agregarNumero('2')" class = "btn">2</button>
                <button onclick = "agregarNumero('0')" class = "btn">0</button>
            </div>
            <div class = "columna">
                <button onclick = "agregarNumero('%')" class = "btn">%</button>
                <button onclick = "agregarNumero('9')" class = "btn">9</button>
                <button onclick = "agregarNumero('6')" class = "btn">6</button>
                <button onclick = "agregarNumero('3')" class = "btn">3</button>
                <button onclick = "calcular()" class = "btn">=</button>
            </div>
            <div class = "columna">
                <button onclick = "agregarNumero('*')" class = "btn">x</button>
                <button onclick = "agregarNumero('/')" class = "btn">÷</button>
                <button onclick = "agregarNumero('-')" class = "btn">-</button>
                <button onclick = "agregarNumero('+')" class = "btn-suma">+</button>
            </div>
        </div>
    </div>
    

    <script src="script.js"></script>
</body>
</html>
